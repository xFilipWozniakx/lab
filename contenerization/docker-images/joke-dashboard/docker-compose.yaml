services:
  init:
    image: busybox
    command: chown -R 101:101 /html
    volumes:
      - html:/html

  updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    volumes:
      - html:/html
    user: "101:101"
    restart: unless-stopped
    depends-on: 
      init: 
        condition: service_completed_succefully
  web:
    image: nginxinc/nginx-unprivileged:1.28
    ports:
      - "8080:8080"
    volumes:
      - html:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends-on:
      init: 
      conditions: service_completed_succefully

volumes:
  html:
