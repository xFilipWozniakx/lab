apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mealie
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
      - image: ghcr.io/mealie-recipes/mealie:v3.21.0
        name: mealie
        ports:
          - containerPort: 9000
        volumeMounts:
          - name: pvc-data-base
            mountPath: "/app/data"
      volumes:
        - name: pvc-data-base
          persistentVolumeClaim:
            claimName: mealie-pv



