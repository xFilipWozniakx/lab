apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
  labels:
    type: local
  name: mealie-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 600Mi
  hostPath:
    path: /data/kubernetes-pv/mealie
    type: ""
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
